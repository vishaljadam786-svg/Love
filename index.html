<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Be My Girlfriend?</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #ffd1dc 0%, #ff8da1 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      overflow-x: hidden;
      position: relative;
    }

    /* Top-Middle Fixed Highlighted Music Button */
    .highlight-music-btn {
      position: fixed;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      background: linear-gradient(45deg, #ff0054, #ff4d6d);
      color: white;
      border: 2px solid #ffffff;
      padding: 10px 22px;
      border-radius: 30px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(255, 0, 84, 0.5);
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.3s ease;
      animation: topPulseGlow 1.6s infinite ease-in-out;
      user-select: none;
      white-space: nowrap;
    }

    .highlight-music-btn:hover {
      transform: translateX(-50%) scale(1.08);
      box-shadow: 0 0 25px rgba(255, 0, 84, 0.9);
    }

    @keyframes topPulseGlow {
      0% {
        transform: translateX(-50%) scale(1);
        box-shadow: 0 0 0 0 rgba(255, 0, 84, 0.7);
      }
      70% {
        transform: translateX(-50%) scale(1.06);
        box-shadow: 0 0 0 16px rgba(255, 0, 84, 0);
      }
      100% {
        transform: translateX(-50%) scale(1);
        box-shadow: 0 0 0 0 rgba(255, 0, 84, 0);
      }
    }

    /* Floating Hearts Background Container */
    #hearts-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    .heart {
      position: absolute;
      bottom: -50px;
      user-select: none;
      animation: floatUp linear infinite;
    }

    @keyframes floatUp {
      0% { transform: translateY(0) scale(0.8); opacity: 0; }
      20% { opacity: 0.8; }
      80% { opacity: 0.8; }
      100% { transform: translateY(-105vh) scale(1.2); opacity: 0; }
    }

    /* Main Card Layout */
    .card {
      position: relative;
      z-index: 2;
      padding: 1rem;
      max-width: 90vw;
      width: 450px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-top: 40px; /* Space for top button */
    }

    /* Bouncing Bear Emoji */
    .bear {
      font-size: 5rem;
      display: inline-block;
      animation: bounce 1.5s infinite ease-in-out;
      margin-bottom: 0.5rem;
      user-select: none;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-20px); }
    }

    h1 {
      font-family: 'Dancing Script', cursive;
      font-size: 2.8rem;
      color: #8b0032;
      margin-bottom: 0.5rem;
      line-height: 1.2;
    }

    .subtitle {
      font-style: italic;
      color: #5a0020;
      font-size: 1rem;
      margin-bottom: 1.5rem;
    }

    .quote {
      font-size: 0.85rem;
      color: #7a1c3d;
      margin-top: 2rem;
    }

    /* Buttons */
    .button-group {
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      gap: 40px;
      margin-top: 1rem;
      width: 100%;
    }

    .btn {
      font-family: 'Poppins', sans-serif;
      font-size: 1.1rem;
      font-weight: 600;
      border: none;
      cursor: pointer;
      user-select: none;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    #yesBtn, .next-btn {
      background: linear-gradient(45deg, #ff0040, #ff4d6d);
      color: white;
      padding: 12px 30px;
      border-radius: 50px;
      box-shadow: 0 4px 15px rgba(255, 0, 64, 0.4);
      margin-top: 15px;
    }

    #yesBtn:hover, .next-btn:hover {
      transform: scale(1.08);
      box-shadow: 0 0 25px rgba(255, 0, 64, 0.8);
    }

    #noBtn {
      background-color: white;
      color: #ff0040;
      border: 2px solid #ff0040;
      padding: 8px 20px;
      border-radius: 50px;
      z-index: 100;
    }

    /* Cheeky Toast Message */
    #toast {
      position: fixed;
      top: 15%;
      left: 50%;
      transform: translateX(-50%);
      background-color: rgba(139, 0, 50, 0.85);
      color: white;
      padding: 10px 20px;
      border-radius: 20px;
      font-size: 0.9rem;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s ease;
      z-index: 1000;
    }

    /* Celebration Container */
    #celebration {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }

    .yay-text {
      font-size: 1.8rem;
      font-weight: 600;
      color: #8b0032;
      animation: pulse 1s infinite alternate;
      margin-bottom: 0.8rem;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      100% { transform: scale(1.05); }
    }

    .spinning-emoji {
      font-size: 3.5rem;
      animation: spin 3s infinite linear;
      margin-bottom: 0.8rem;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .final-message {
      font-size: 1.1rem;
      color: #5a0020;
      margin-bottom: 1.2rem;
    }

    /* Video Wrapper Container */
    .video-wrapper {
      width: 280px;
      height: 280px;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 8px 20px rgba(139, 0, 50, 0.25);
      position: relative;
    }

    .celebration-video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scale(1.38);
    }

    /* Photo Album Section */
    #photoPage {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
      width: 100%;
    }

    .book-container {
      width: 270px;
      height: 370px;
      perspective: 1200px;
      margin: 20px auto;
      position: relative;
    }

    /* Real Book Base */
    .book-base {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      background: #ffffff;
      border-radius: 12px;
      border: 3px solid #8b0032;
      box-shadow: 
        0 10px 25px rgba(0, 0, 0, 0.25),
        4px 4px 0px #f4e8ec,
        7px 7px 0px #e6cbd3,
        10px 10px 0px #8b0032;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 15px;
    }

    .book {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
    }

    .page {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.15);
      transform-origin: center;
      transition: transform 0.6s ease-in-out, opacity 0.4s ease-in-out;
      cursor: pointer;
      background: white;
      border: 4px solid white;
    }

    .page img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .page.flipped {
      transform: translateX(-120%) rotate(-10deg);
      opacity: 0;
      pointer-events: none;
    }

    .hint-text {
      font-size: 0.85rem;
      color: #7a1c3d;
      margin-top: 5px;
    }

    /* Burst Emoji Particles */
    .burst-emoji {
      position: fixed;
      pointer-events: none;
      z-index: 9999;
      animation: burstFly 1.5s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
      user-select: none;
    }

    @keyframes burstFly {
      0% {
        transform: translate(-50%, -50%) scale(0.4);
        opacity: 1;
      }
      70% {
        opacity: 1;
      }
      100% {
        transform: translate(calc(-50% + var(--tx)), calc(-50% + var(--ty))) scale(1.6);
        opacity: 0;
      }
    }

    /* Confetti */
    .confetti {
      position: fixed;
      width: 10px;
      height: 10px;
      z-index: 99;
      pointer-events: none;
      animation: fall linear forwards;
    }

    @keyframes fall {
      0% { transform: translateY(-10vh) rotate(0deg); opacity: 1; }
      100% { transform: translateY(105vh) rotate(720deg); opacity: 0; }
    }
  </style>
</head>
<body>

  <!-- Background Audio Element -->
  <audio id="bgMusic" loop preload="auto">
    <source src="song.mp3" type="audio/mpeg">
  </audio>

  <!-- Top Middle Fixed Highlighted Play Song Button -->
  <button id="musicBtn" class="highlight-music-btn">🎵 Play Song for Vibe ✨</button>

  <!-- Floating Hearts Background -->
  <div id="hearts-container"></div>

  <!-- Toast Notification -->
  <div id="toast"></div>

  <!-- Main Question UI -->
  <div class="card" id="proposalCard">
    <div class="bear">🧸</div>
    <h1>Will You Be My Girlfriend, Monika?</h1>
    <p class="subtitle">I've been gathering courage to ask you this...</p>

    <div class="button-group">
      <button class="btn" id="yesBtn">Yes</button>
      <button class="btn" id="noBtn">No</button>
    </div>

    <p class="quote">"Every love story is beautiful, but ours is my favourite"</p>
  </div>

  <!-- Celebration UI -->
  <div class="card" id="celebration">
    <div class="yay-text">YAYYYY I KNOW YOU LOVE ME ☺️!!</div>
    <div class="spinning-emoji">💖</div>
    <p class="final-message">I knew you'd say yes...</p>
    
    <div class="video-wrapper">
      <video class="celebration-video" autoplay loop muted playsinline controls>
        <source src="video.mp4" type="video/mp4">
        Your browser does not support the video tag.
      </video>
    </div>

    <button class="btn next-btn" id="goToPhotosBtn">Our Memories 📖</button>
  </div>

  <!-- Photo Book Page -->
  <div class="card" id="photoPage">
    <h1 style="font-size: 2.2rem;">Our Special Moments 💕</h1>
    <p class="hint-text">Photo par tap karein page palatne ke liye!</p>

    <div class="book-container">
      <div class="book-base"></div>

      <div class="book" id="book">
        <div class="page" data-page="5" style="z-index: 1;"><img src="image5.jpg" alt="Memory 5"></div>
        <div class="page" data-page="4" style="z-index: 2;"><img src="image4.jpg" alt="Memory 4"></div>
        <div class="page" data-page="3" style="z-index: 3;"><img src="image3.jpg" alt="Memory 3"></div>
        <div class="page" data-page="2" style="z-index: 4;"><img src="image2.jpg" alt="Memory 2"></div>
        <div class="page" data-page="1" style="z-index: 5;"><img src="image1.jpg" alt="Memory 1"></div>
      </div>
    </div>
  </div>

  <script>
    const bgMusic = document.getElementById('bgMusic');
    const musicBtn = document.getElementById('musicBtn');

    function toggleMusic() {
      if (bgMusic.paused) {
        bgMusic.play().then(() => {
          musicBtn.innerHTML = '⏸️ Pause Song 🎶';
        }).catch(err => console.log('Audio play error:', err));
      } else {
        bgMusic.pause();
        musicBtn.innerHTML = '🎵 Play Song for Vibe ✨';
      }
    }

    musicBtn.addEventListener('click', toggleMusic);

    // Create Floating Hearts
    const heartsContainer = document.getElementById('hearts-container');
    const heartEmojis = ['❤️', '💖', '💗', '💓', '💕'];
    
    function createHearts() {
      for (let i = 0; i < 15; i++) {
        const heart = document.createElement('div');
        heart.classList.add('heart');
        heart.innerText = heartEmojis[Math.floor(Math.random() * heartEmojis.length)];
        
        const size = Math.random() * 1.5 + 1;
        const left = Math.random() * 100;
        const duration = Math.random() * 4 + 4;
        const delay = Math.random() * 5;

        heart.style.fontSize = `${size}rem`;
        heart.style.left = `${left}%`;
        heart.style.animationDuration = `${duration}s`;
        heart.style.animationDelay = `${delay}s`;

        heartsContainer.appendChild(heart);
      }
    }
    createHearts();

    // No Button Run Away Logic
    const noBtn = document.getElementById('noBtn');
    const yesBtn = document.getElementById('yesBtn');
    const toast = document.getElementById('toast');

    const cheekyMessages = [
      "Nope, not an option!",
      "Try again!",
      "You sure about that?",
      "Not happening!",
      "Think again!"
    ];
    let messageIndex = 0;

    function showToast(msg) {
      toast.innerText = msg;
      toast.style.opacity = '1';
      setTimeout(() => {
        toast.style.opacity = '0';
      }, 1500);
    }

    function moveNoButton() {
      showToast(cheekyMessages[messageIndex]);
      messageIndex = (messageIndex + 1) % cheekyMessages.length;

      const yesRect = yesBtn.getBoundingClientRect();
      const btnWidth = noBtn.offsetWidth || 80;
      const btnHeight = noBtn.offsetHeight || 40;

      const padding = 20;
      const maxX = window.innerWidth - btnWidth - padding;
      const maxY = window.innerHeight - btnHeight - padding;

      let newX, newY;
      let overlaps = true;
      let attempts = 0;

      while (overlaps && attempts < 100) {
        newX = Math.max(padding, Math.floor(Math.random() * maxX));
        newY = Math.max(padding, Math.floor(Math.random() * maxY));

        const buffer = 40;
        const noRectTemp = {
          left: newX - buffer,
          right: newX + btnWidth + buffer,
          top: newY - buffer,
          bottom: newY + btnHeight + buffer
        };

        const isOverlapping = !(
          noRectTemp.right < yesRect.left ||
          noRectTemp.left > yesRect.right ||
          noRectTemp.bottom < yesRect.top ||
          noRectTemp.top > yesRect.bottom
        );

        if (!isOverlapping) {
          overlaps = false;
        }
        attempts++;
      }

      noBtn.style.position = 'fixed';
      noBtn.style.left = `${newX}px`;
      noBtn.style.top = `${newY}px`;
    }

    noBtn.addEventListener('mouseover', moveNoButton);
    noBtn.addEventListener('touchstart', (e) => {
      e.preventDefault();
      moveNoButton();
    });
    noBtn.addEventListener('click', (e) => {
      e.preventDefault();
      moveNoButton();
    });

    // Yes Button Click - Celebration & Auto Play Audio
    yesBtn.addEventListener('click', () => {
      if (bgMusic.paused) {
        bgMusic.play().then(() => {
          musicBtn.innerHTML = '⏸️ Pause Song 🎶';
        }).catch(e => console.log('Autoplay blocked:', e));
      }

      document.getElementById('proposalCard').style.display = 'none';
      heartsContainer.innerHTML = '';

      const celebration = document.getElementById('celebration');
      celebration.style.display = 'flex';

      const video = celebration.querySelector('video');
      if (video) {
        video.play().catch(e => console.log('Video autoplay blocked:', e));
      }

      const colors = ['#ff0054', '#9e0059', '#ffbd00', '#ff5400', '#390099', '#ffffff', '#ff4d6d'];
      for (let i = 0; i < 120; i++) {
        const confetti = document.createElement('div');
        confetti.classList.add('confetti');
        
        confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
        confetti.style.left = `${Math.random() * 100}vw`;
        confetti.style.animationDuration = `${Math.random() * 3 + 2}s`;
        confetti.style.animationDelay = `${Math.random() * 0.5}s`;
        
        if (Math.random() > 0.5) {
          confetti.style.borderRadius = '50%';
        }

        document.body.appendChild(confetti);
      }
    });

    // Go to Photos Page
    document.getElementById('goToPhotosBtn').addEventListener('click', () => {
      document.getElementById('celebration').style.display = 'none';
      document.getElementById('photoPage').style.display = 'flex';
    });

    // Emoji Burst Effects Function
    function triggerEmojiBurst(emojiList, clickX, clickY) {
      const count = 25;
      const startX = clickX || (window.innerWidth / 2);
      const startY = clickY || (window.innerHeight / 2);

      for (let i = 0; i < count; i++) {
        const el = document.createElement('div');
        el.classList.add('burst-emoji');
        el.innerText = emojiList[Math.floor(Math.random() * emojiList.length)];
        
        const size = Math.random() * 1.5 + 1.2;
        el.style.fontSize = `${size}rem`;
        el.style.left = `${startX}px`;
        el.style.top = `${startY}px`;

        const angle = Math.random() * Math.PI * 2;
        const distance = Math.random() * 220 + 80;
        const tx = Math.cos(angle) * distance;
        const ty = Math.sin(angle) * distance;

        el.style.setProperty('--tx', `${tx}px`);
        el.style.setProperty('--ty', `${ty}px`);

        document.body.appendChild(el);

        setTimeout(() => el.remove(), 1500);
      }
    }

    // Book Page Flip Logic
    const pages = document.querySelectorAll('.page');
    const heartBurst = ['❤️', '💖', '💗', '💓', '💕'];
    const starBurst = ['⭐', '✨', '🌟', '💫', '⚡'];
    const balloonBurst = ['🎈', '🎈', '🎈', '🎉', '🎈'];

    pages.forEach((page) => {
      page.addEventListener('click', (e) => {
        const pageNum = parseInt(page.getAttribute('data-page'));
        const clickX = e.clientX || window.innerWidth / 2;
        const clickY = e.clientY || window.innerHeight / 2;

        if (pageNum === 1 || pageNum === 4) {
          triggerEmojiBurst(heartBurst, clickX, clickY);
        } else if (pageNum === 2 || pageNum === 5) {
          triggerEmojiBurst(starBurst, clickX, clickY);
        } else if (pageNum === 3) {
          triggerEmojiBurst(balloonBurst, clickX, clickY);
        }

        if (pageNum === 5) {
          page.classList.add('flipped');
          setTimeout(() => {
            pages.forEach((p) => p.classList.remove('flipped'));
          }, 400);
        } else {
          page.classList.add('flipped');
        }
      });
    });
  </script>
</body>
</html>
