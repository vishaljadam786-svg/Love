<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Be My Girlfriend?</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #ffd1dc 0%, #ff8da1 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      overflow-x: hidden;
      position: relative;
    }

    /* Floating Hearts Container */
    #hearts-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    .heart {
      position: absolute;
      bottom: -50px;
      user-select: none;
      animation: floatUp linear infinite;
    }

    @keyframes floatUp {
      0% { transform: translateY(0) scale(0.8); opacity: 0; }
      20% { opacity: 0.8; }
      80% { opacity: 0.8; }
      100% { transform: translateY(-105vh) scale(1.2); opacity: 0; }
    }

    /* Main Card Layout */
    .card {
      position: relative;
      z-index: 2;
      padding: 1.5rem;
      max-width: 90vw;
      width: 450px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* Bouncing Bear Emoji */
    .bear {
      font-size: 5rem;
      display: inline-block;
      animation: bounce 1.5s infinite ease-in-out;
      margin-bottom: 0.5rem;
      user-select: none;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-20px); }
    }

    h1 {
      font-family: 'Dancing Script', cursive;
      font-size: 2.8rem;
      color: #8b0032;
      margin-bottom: 0.5rem;
      line-height: 1.2;
    }

    .subtitle {
      font-style: italic;
      color: #5a0020;
      font-size: 1rem;
      margin-bottom: 1.5rem;
    }

    .quote {
      font-size: 0.85rem;
      color: #7a1c3d;
      margin-top: 2rem;
    }

    /* Buttons */
    .button-group {
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      gap: 40px;
      margin-top: 1rem;
      width: 100%;
    }

    .btn {
      font-family: 'Poppins', sans-serif;
      font-size: 1.1rem;
      font-weight: 600;
      border: none;
      cursor: pointer;
      user-select: none;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    #yesBtn, .next-btn {
      background: linear-gradient(45deg, #ff0040, #ff4d6d);
      color: white;
      padding: 12px 30px;
      border-radius: 50px;
      box-shadow: 0 4px 15px rgba(255, 0, 64, 0.4);
      margin-top: 15px;
    }

    #yesBtn:hover, .next-btn:hover {
      transform: scale(1.08);
      box-shadow: 0 0 25px rgba(255, 0, 64, 0.8);
    }

    #noBtn {
      background-color: white;
      color: #ff0040;
      border: 2px solid #ff0040;
      padding: 8px 20px;
      border-radius: 50px;
      z-index: 100;
    }

    /* Cheeky Toast Message */
    #toast {
      position: fixed;
      top: 10%;
      left: 50%;
      transform: translateX(-50%);
      background-color: rgba(139, 0, 50, 0.85);
      color: white;
      padding: 10px 20px;
      border-radius: 20px;
      font-size: 0.9rem;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s ease;
      z-index: 1000;
    }

    /* Celebration Container */
    #celebration {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }

    .yay-text {
      font-size: 1.8rem;
      font-weight: 600;
      color: #8b0032;
      animation: pulse 1s infinite alternate;
      margin-bottom: 0.8rem;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      100% { transform: scale(1.05); }
    }

    .spinning-emoji {
      font-size: 3.5rem;
      animation: spin 3s infinite linear;
      margin-bottom: 0.8rem;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .final-message {
      font-size: 1.1rem;
      color: #5a0020;
      margin-bottom: 1.2rem;
    }

    /* Video Wrapper Container - Crops hardcoded black bars */
    .video-wrapper {
      width: 280px;
      height: 280px;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 8px 20px rgba(139, 0, 50, 0.25);
      position: relative;
    }

    .celebration-video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scale(1.38);
    }

    /* Photo Album Section (3D Book Flip) */
    #photoPage {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }

    .book-container {
      width: 280px;
      height: 360px;
      perspective: 1000px;
      margin: 15px 0;
      position: relative;
    }

    .book {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
    }

    .page {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      border-radius: 15px;
      overflow: hidden;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
      transform-origin: left;
      transition: transform 0.8s cubic-bezier(0.645, 0.045, 0.355, 1);
      cursor: pointer;
      background: white;
      border: 4px solid white;
    }

    .page img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Flipped class for 3D page turn */
    .page.flipped {
      transform: rotateY(-180deg);
    }

    .hint-text {
      font-size: 0.85rem;
      color: #7a1c3d;
      margin-top: 5px;
    }

    /* Confetti */
    .confetti {
      position: fixed;
      width: 10px;
      height: 10px;
      z-index: 99;
      pointer-events: none;
      animation: fall linear forwards;
    }

    @keyframes fall {
      0% { transform: translateY(-10vh) rotate(0deg); opacity: 1; }
      100% { transform: translateY(105vh) rotate(720deg); opacity: 0; }
    }
  </style>
</head>
<body>

  <!-- Floating Hearts Background -->
  <div id="hearts-container"></div>

  <!-- Toast Notification for No Button -->
  <div id="toast"></div>

  <!-- Main Question UI -->
  <div class="card" id="proposalCard">
    <div class="bear">🧸</div>
    <h1>Will You Be My Girlfriend, Monika?</h1>
    <p class="subtitle">I've been gathering courage to ask you this...</p>

    <div class="button-group">
      <button class="btn" id="yesBtn">Yes</button>
      <button class="btn" id="noBtn">No</button>
    </div>

    <p class="quote">"Every love story is beautiful, but ours is my favourite"</p>
  </div>

  <!-- Celebration UI (Video Page) -->
  <div class="card" id="celebration">
    <div class="yay-text">YAYYYY I KNOW YOU LOVE ME ☺️!!</div>
    <div class="spinning-emoji">💖</div>
    <p class="final-message">I knew you'd say yes...</p>
    
    <!-- Cropped Video Container -->
    <div class="video-wrapper">
      <video class="celebration-video" autoplay loop muted playsinline controls>
        <source src="video.mp4" type="video/mp4">
        Your browser does not support the video tag.
      </video>
    </div>

    <button class="btn next-btn" id="goToPhotosBtn">Our Memories 📖</button>
  </div>

  <!-- Photo Book Page -->
  <div class="card" id="photoPage">
    <h1 style="font-size: 2.2rem;">Our Special Moments 💕</h1>
    <p class="hint-text">Photo par tap karein page palatne ke liye!</p>

    <div class="book-container">
      <div class="book" id="book">
        <!-- Pages stacked backwards (Image 5 bottom, Image 1 top) -->
        <div class="page" style="z-index: 1;"><img src="image5.jpg" alt="Memory 5"></div>
        <div class="page" style="z-index: 2;"><img src="image4.jpg" alt="Memory 4"></div>
        <div class="page" style="z-index: 3;"><img src="image3.jpg" alt="Memory 3"></div>
        <div class="page" style="z-index: 4;"><img src="image2.jpg" alt="Memory 2"></div>
        <div class="page" style="z-index: 5;"><img src="image1.jpg" alt="Memory 1"></div>
      </div>
    </div>
  </div>

  <script>
    // Create 15 Floating Hearts
    const heartsContainer = document.getElementById('hearts-container');
    const heartEmojis = ['❤️', '💖', '💗', '💓', '💕'];
    
    function createHearts() {
      for (let i = 0; i < 15; i++) {
        const heart = document.createElement('div');
        heart.classList.add('heart');
        heart.innerText = heartEmojis[Math.floor(Math.random() * heartEmojis.length)];
        
        const size = Math.random() * 1.5 + 1;
        const left = Math.random() * 100;
        const duration = Math.random() * 4 + 4;
        const delay = Math.random() * 5;

        heart.style.fontSize = `${size}rem`;
        heart.style.left = `${left}%`;
        heart.style.animationDuration = `${duration}s`;
        heart.style.animationDelay = `${delay}s`;

        heartsContainer.appendChild(heart);
      }
    }
    createHearts();

    // No Button Run Away Logic
    const noBtn = document.getElementById('noBtn');
    const yesBtn = document.getElementById('yesBtn');
    const toast = document.getElementById('toast');

    const cheekyMessages = [
      "Nope, not an option!",
      "Try again!",
      "You sure about that?",
      "Not happening!",
      "Think again!"
    ];
    let messageIndex = 0;

    function showToast(msg) {
      toast.innerText = msg;
      toast.style.opacity = '1';
      setTimeout(() => {
        toast.style.opacity = '0';
      }, 1500);
    }

    function moveNoButton() {
      showToast(cheekyMessages[messageIndex]);
      messageIndex = (messageIndex + 1) % cheekyMessages.length;

      const yesRect = yesBtn.getBoundingClientRect();
      const btnWidth = noBtn.offsetWidth || 80;
      const btnHeight = noBtn.offsetHeight || 40;

      const padding = 20;
      const maxX = window.innerWidth - btnWidth - padding;
      const maxY = window.innerHeight - btnHeight - padding;

      let newX, newY;
      let overlaps = true;
      let attempts = 0;

      while (overlaps && attempts < 100) {
        newX = Math.max(padding, Math.floor(Math.random() * maxX));
        newY = Math.max(padding, Math.floor(Math.random() * maxY));

        const buffer = 40;
        const noRectTemp = {
          left: newX - buffer,
          right: newX + btnWidth + buffer,
          top: newY - buffer,
          bottom: newY + btnHeight + buffer
        };

        const isOverlapping = !(
          noRectTemp.right < yesRect.left ||
          noRectTemp.left > yesRect.right ||
          noRectTemp.bottom < yesRect.top ||
          noRectTemp.top > yesRect.bottom
        );

        if (!isOverlapping) {
          overlaps = false;
        }
        attempts++;
      }

      noBtn.style.position = 'fixed';
      noBtn.style.left = `${newX}px`;
      noBtn.style.top = `${newY}px`;
    }

    noBtn.addEventListener('mouseover', moveNoButton);
    noBtn.addEventListener('touchstart', (e) => {
      e.preventDefault();
      moveNoButton();
    });
    noBtn.addEventListener('click', (e) => {
      e.preventDefault();
      moveNoButton();
    });

    // Yes Button Click - Celebration
    yesBtn.addEventListener('click', () => {
      document.getElementById('proposalCard').style.display = 'none';
      heartsContainer.innerHTML = '';

      const celebration = document.getElementById('celebration');
      celebration.style.display = 'flex';

      const video = celebration.querySelector('video');
      if (video) {
        video.play().catch(e => console.log('Autoplay blocked:', e));
      }

      const colors = ['#ff0054', '#9e0059', '#ffbd00', '#ff5400', '#390099', '#ffffff', '#ff4d6d'];
      for (let i = 0; i < 120; i++) {
        const confetti = document.createElement('div');
        confetti.classList.add('confetti');
        
        confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
        confetti.style.left = `${Math.random() * 100}vw`;
        confetti.style.animationDuration = `${Math.random() * 3 + 2}s`;
        confetti.style.animationDelay = `${Math.random() * 0.5}s`;
        
        if (Math.random() > 0.5) {
          confetti.style.borderRadius = '50%';
        }

        document.body.appendChild(confetti);
      }
    });

    // Go to Photos Page
    document.getElementById('goToPhotosBtn').addEventListener('click', () => {
      document.getElementById('celebration').style.display = 'none';
      document.getElementById('photoPage').style.display = 'flex';
    });

    // Book Page Flip Logic
    const pages = document.querySelectorAll('.page');
    pages.forEach((page) => {
      page.addEventListener('click', () => {
        if (page.classList.contains('flipped')) {
          page.classList.remove('flipped');
        } else {
          page.classList.add('flipped');
        }
      });
    });
  </script>
</body>
</html>
